def versions = [:]
versions.gdx = '1.9.11'
versions.junit = '5.9.3'
versions.mockito = '4.11.0'

def deps = [:]

def gdx = [:]
gdx.gdx = "com.badlogicgames.gdx:gdx:$versions.gdx"
gdx.backend_lwjgl3 = "com.badlogicgames.gdx:gdx-backend-lwjgl3:$versions.gdx"
gdx.platform_desktop = "com.badlogicgames.gdx:gdx-platform:$versions.gdx:natives-desktop"
deps.gdx = gdx

def junit = [:]
junit.jupiter = "org.junit.jupiter:junit-jupiter:$versions.junit"
junit.platform_launcher = "org.junit.platform:junit-platform-launcher:1.9.3"
deps.junit = junit

def mockito = [:]
mockito.core = "org.mockito:mockito-core:$versions.mockito"
deps.mockito = mockito

ext.deps = deps
